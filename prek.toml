[[repos]]
repo = "local"

[[repos.hooks]]
id = "markdown-delivery-notes"
name = "Check Markdown for internal delivery notes"
entry = "python scripts/check_markdown_delivery.py"
language = "system"
files = '(?i)\.(md|markdown|mdx)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "readme-style"
name = "Check the project README structure and headings"
entry = "python scripts/check_readme_style.py"
language = "system"
files = '^README\.md$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "gitleaks-staged"
name = "Scan staged changes for secrets"
entry = "gitleaks git --pre-commit --staged --redact=100 --no-banner"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "commit-message-style"
name = "Check commit message subject"
entry = "python scripts/check_commit_message.py"
language = "system"
stages = ["commit-msg"]
